# TEMPLATE ONLY. Do not put real values in this file or commit them.
# Create the real Secret out of band, e.g.
#   kubectl -n smtrack create secret generic authentication-v2-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=JWT_REFRESH_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=DATABASE_URL='postgres://auth_app:...@host:5432/smtrack_auth_v2' \
#     --from-literal=REDIS_PASSWORD='...'
# or with your secret manager / sealed-secrets. Requirements the service enforces at startup:
# both JWT secrets at least 32 characters and different from each other.
# DATABASE_URL must be a NEW database (ADR 0004) and its user must not own audit_logs, so the
# service cannot drop the append-only trigger; see docs/security/iso27001-controls.md.
apiVersion: v1
kind: Secret
metadata:
  name: authentication-v2-secrets
  namespace: smtrack
type: Opaque
stringData:
  JWT_SECRET: "replace-me-with-at-least-32-random-characters"
  JWT_REFRESH_SECRET: "replace-me-with-a-different-32-character-secret"
  DATABASE_URL: "postgres://user:password@host:5432/smtrack_auth_v2?sslmode=require"
  REDIS_PASSWORD: ""
